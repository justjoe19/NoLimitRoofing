[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    # Astro fingerprints these filenames (content hash in the name), so a
    # new deploy always ships a new URL — safe to cache forever.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

# --- Old WordPress site (nolimitroofingin.com before the cutover) ---
# Every address the old site had in Google's index, sent to the home page so
# old links and search results land somewhere useful instead of on a 404.
# The new site has only 3 pages, so everything goes to "/". Splat rules cover
# the old /services/*, /service-areas/* (counties, cities, "...roof-replacement"
# pages), /roofing-blog/* and /author/* trees.
# Not forced (Netlify's default): if a real file exists at one of these paths
# (e.g. a shelved page is re-enabled later), the file wins over the redirect.
# Anything not listed here and not a real page gets the custom 404 page.
[[redirects]]
